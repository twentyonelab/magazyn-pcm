<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-16 -16 1532 892"
  width="1532"
  height="892"
  preserveAspectRatio="xMidYMid meet"
  class="schema"
  role="img"
  aria-label="Schemat instalacji magazynu ciepła PCM"
>
  <!--
    SCHEMAT INSTALACJI — PLIK ZEWNĘTRZNY. Wersja graficzna v0.5.

    GRAFIKI SĄ WYCINKAMI Z MAKIETY PROJEKTANTA (narzedzia/makieta-v03.png).
    Wycina je narzedzia/wytnij-z-makiety.mjs według narzedzia/wycinki.json:
    rury, kule złączek, płaszcz zbiornika i karty urządzeń pochodzą z renderów
    makiety, nie z rysowania od nowa. Wypieczone kropki sond na zbiorniku są
    zamalowane (zostały po nich subtelne króćce — na nich siadają żywe kropki),
    wiersze „góra/dół" na karcie zasobnika są wybielone (żywe wartości wchodzą
    w to miejsce), dioda na karcie pompy ciepła usunięta (żywa siedzi obok).

    JĘZYK POŁĄCZEŃ — wiernie z makiety:
      - DWIE ciągłe linie nad zbiornikiem (górna i dolna),
      - Z DEKLA WYCHODZĄ CZTERY PIONY: skrajne do linii górnej, środkowa para
        do dolnej; piony skrajne PRZECINAJĄ dolną linię bez złączki
        (skrzyżowanie, nie połączenie),
      - złączki to metalowe KULE — kula tylko tam, gdzie rury naprawdę się
        łączą,
      - zejścia do urządzeń: lewa strona do podgrzewacza (zasilanie i powrót),
        prawa do zasobnika 80 l (koniec dolnej linii) i do pompy ciepła
        (koniec górnej linii); naczynie przeponowe ma krótki pion z kulą
        na końcu, jak w makiecie.

    Warstwa przepływu (data-flow) to ścieżki SVG rysowane NA rastrach —
    kontrakt bez zmian. Rastrowe karty urządzeń mają PRZEZROCZYSTE NAKŁADKI
    (rect.nakladka), które niosą klik (data-element), kontrakt 3D (data-object)
    i obwódkę najechania — raster nie umie mieć obrysu, prostokąt umie.

    KONTRAKT WIĄZANIA
      data-point="A1"              element pokazuje wartość punktu (textContent)
      data-unit="°C"               jednostka dopisywana po wartości
      data-fill-point="A1"         element barwi się według wartości punktu
      data-flow="pcm-supply"       ścieżka animuje przepływ
      data-flow-source="METER_FLOW"  prędkość animacji z tej wartości
      data-state="VALVE_STATE"     element przełącza klasę is-active/is-inactive
      data-stale-hide              element chowany, gdy punkt jest przestarzały
      data-sensor="A1"             grupa sondy: kursor, podpowiedź, klik
      data-element="meter"         KLIKALNY element instalacji (nie sonda)

    KONTRAKT DLA WIDOKU 3D
    Widok 3D czyta data-object/data-label/data-h/data-vessel z elementów
    mających x/y/width/height (tu: nakładki) oraz rury z `d` ścieżek data-flow.

    UKŁAD SOND: dwa pręty na PRZEKĄTNYCH ZBIORNIKA, po trzy sondy.
    Poziom 1 = dół, 2 = środek, 3 = góra (potwierdzone 2026-07-29).
    Pozycje kropek (y 391/479/567) celują w króćce widoczne na płaszczu.
  -->

  <defs>
    <filter id="soft-sm" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f1f14" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- =====================================================================
       RURY — wycinki z makiety. Dwie ciągłe linie + piony + kule złączek.
       ===================================================================== -->

  <g class="tubes">
    <!-- Linia górna i dolna — ciągłe nad zbiornikiem. -->
    <image class="raster" href="/schemat/rura-pozioma.png" x="450" y="158" width="935" height="24" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pozioma.png" x="486" y="193" width="574" height="24" preserveAspectRatio="none" />

    <!-- Zejścia do podgrzewacza (zasilanie i powrót odbioru). -->
    <image class="raster" href="/schemat/rura-pionowa.png" x="438" y="158" width="24" height="482" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pionowa.png" x="474" y="193" width="24" height="447" preserveAspectRatio="none" />

    <!-- Cztery piony z dekla: skrajne do linii górnej, para do dolnej. -->
    <image class="raster" href="/schemat/rura-pionowa.png" x="698" y="158" width="24" height="146" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pionowa.png" x="726" y="193" width="24" height="111" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pionowa.png" x="742" y="193" width="24" height="111" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pionowa.png" x="783" y="158" width="24" height="146" preserveAspectRatio="none" />

    <!-- Zejścia prawej strony: zasobnik (koniec dolnej), pompa ciepła
         (koniec górnej), krótki pion naczynia z kulą na końcu. -->
    <image class="raster" href="/schemat/rura-pionowa.png" x="1048" y="193" width="24" height="367" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pionowa.png" x="1373" y="158" width="24" height="402" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pionowa.png" x="1194" y="470" width="24" height="90" preserveAspectRatio="none" />

    <!-- Woda wodociągowa między kartami — cieńszy przewód. -->
    <image class="raster" href="/schemat/rura-pozioma.png" x="176" y="693" width="44" height="14" preserveAspectRatio="none" />
    <image class="raster" href="/schemat/rura-pozioma.png" x="356" y="693" width="44" height="14" preserveAspectRatio="none" />
  </g>

  <!-- Warstwa przepływu — kontrakt data-flow, kolory obiegów. -->
  <g class="flows" fill="none">
    <path
      class="tube__flow tube__flow--supply"
      data-flow="dhw-supply"
      data-flow-source="METER_FLOW"
      d="M710 300 V170 H450 V640"
    />
    <path
      class="tube__flow tube__flow--return"
      data-flow="dhw-return"
      data-flow-source="METER_FLOW"
      d="M486 640 V205 H738 V300"
    />
    <path
      class="tube__flow tube__flow--supply"
      data-flow="pcm-supply"
      data-flow-source="METER_FLOW"
      d="M1385 560 V170 H795 V300"
    />
    <path
      class="tube__flow tube__flow--return"
      data-flow="pcm-return"
      data-flow-source="METER_FLOW"
      d="M754 300 V205 H1060 V560"
    />
  </g>

  <!-- Kule złączek — tylko na PRAWDZIWYCH połączeniach. Piony skrajne
       przecinają dolną linię bez kuli: to skrzyżowanie, nie złączka. -->
  <g class="joints">
    <image class="raster" href="/schemat/kula.png" x="437" y="157" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="473" y="192" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="697" y="157" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="725" y="192" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="741" y="192" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="782" y="157" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="1047" y="192" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="1372" y="157" width="26" height="26" />
    <image class="raster" href="/schemat/kula.png" x="1193" y="457" width="26" height="26" />
  </g>

  <!-- =====================================================================
       LEWO — odbiór ciepła na wodę użytkową
       ===================================================================== -->

  <!-- Zaworek bezpieczeństwa nad linią, wydmuch przerywaną strzałką. -->
  <g class="valve" data-element="zawor-bezp-lewy">
    <path class="valve__arrow" d="M560 84 V58" />
    <path class="valve__arrowhead" d="M554 60 L560 48 L566 60 Z" />
    <image class="raster" href="/schemat/karta-zawor.png" x="527" y="96" width="67" height="67" />
    <rect class="nakladka" x="527" y="96" width="67" height="67" rx="12" />
    <text class="label--sm" x="560" y="26">Zawór</text>
    <text class="label--sm" x="560" y="42">bezpieczeństwa</text>
  </g>

  <!-- Manometr odnogi zabezpieczeń. -->
  <g class="gauge" data-element="manometr-lewy">
    <path class="gauge__stem" d="M640 170 V134" />
    <image class="raster" href="/schemat/manometr.png" x="622" y="100" width="35" height="35" />
    <rect class="nakladka" x="622" y="100" width="35" height="35" rx="17" />
  </g>

  <!-- Karty odbioru: woda → filtr → podgrzewacz (wycinki z makiety). -->
  <g class="device" data-element="woda">
    <image class="raster" href="/schemat/karta-woda.png" x="40" y="640" width="136" height="147" />
    <rect class="nakladka" x="40" y="640" width="136" height="147" rx="14" />
  </g>

  <g class="device" data-element="filtr">
    <image class="raster" href="/schemat/karta-filtr.png" x="220" y="640" width="136" height="147" />
    <rect
      class="nakladka"
      x="220"
      y="640"
      width="136"
      height="147"
      rx="14"
      data-object="filtr"
      data-label="Filtr odkamieniający"
      data-h="0.8"
    />
  </g>

  <g class="device" data-element="podgrzewacz">
    <image class="raster" href="/schemat/karta-podgrzewacz.png" x="400" y="640" width="136" height="147" />
    <rect
      class="nakladka"
      x="400"
      y="640"
      width="136"
      height="147"
      rx="14"
      data-object="podgrzewacz"
      data-label="Podgrzewacz wody"
      data-h="3.4"
      data-vessel="true"
    />
  </g>

  <!-- =====================================================================
       ŚRODEK — MAGAZYN PCM (walec z makiety + nakładka z kontraktem)
       ===================================================================== -->

  <g class="storage">
    <image class="raster" href="/schemat/zbiornik.png" x="640" y="288" width="200" height="412" preserveAspectRatio="none" />

    <rect
      class="nakladka"
      x="640"
      y="288"
      width="200"
      height="412"
      rx="16"
      data-object="storage"
      data-label="Magazyn PCM"
      data-h="8"
      data-vessel="true"
      data-element="storage"
    />

    <!-- Sondy przekątnej A — kropki celują w króćce na płaszczu. -->
    <g class="sensor" data-sensor="A3">
      <rect class="sensor__hit" x="582" y="369" width="94" height="44" />
      <circle class="sensor__phase" cx="647.5" cy="391" r="12" />
      <circle class="sensor__cell" data-fill-point="A3" cx="647.5" cy="391" r="7.5" />
      <text class="sensor__id" x="626" y="379" text-anchor="end">A3</text>
      <text class="sensor__value" data-point="A3" data-unit="°C" x="626" y="399" text-anchor="end">—</text>
    </g>

    <g class="sensor" data-sensor="A2">
      <rect class="sensor__hit" x="582" y="457" width="94" height="44" />
      <circle class="sensor__phase" cx="647.5" cy="479" r="12" />
      <circle class="sensor__cell" data-fill-point="A2" cx="647.5" cy="479" r="7.5" />
      <text class="sensor__id" x="626" y="467" text-anchor="end">A2</text>
      <text class="sensor__value" data-point="A2" data-unit="°C" x="626" y="487" text-anchor="end">—</text>
    </g>

    <g class="sensor" data-sensor="A1">
      <rect class="sensor__hit" x="582" y="545" width="94" height="44" />
      <circle class="sensor__phase" cx="647.5" cy="567" r="12" />
      <circle class="sensor__cell" data-fill-point="A1" cx="647.5" cy="567" r="7.5" />
      <text class="sensor__id" x="626" y="555" text-anchor="end">A1</text>
      <text class="sensor__value" data-point="A1" data-unit="°C" x="626" y="575" text-anchor="end">—</text>
    </g>

    <!-- Sondy przekątnej B. -->
    <g class="sensor" data-sensor="B3">
      <rect class="sensor__hit" x="804" y="369" width="100" height="44" />
      <circle class="sensor__phase" cx="832.5" cy="391" r="12" />
      <circle class="sensor__cell" data-fill-point="B3" cx="832.5" cy="391" r="7.5" />
      <text class="sensor__id" x="854" y="379">B3</text>
      <text class="sensor__value" data-point="B3" data-unit="°C" x="854" y="399">—</text>
    </g>

    <g class="sensor" data-sensor="B2">
      <rect class="sensor__hit" x="804" y="457" width="100" height="44" />
      <circle class="sensor__phase" cx="832.5" cy="479" r="12" />
      <circle class="sensor__cell" data-fill-point="B2" cx="832.5" cy="479" r="7.5" />
      <text class="sensor__id" x="854" y="467">B2</text>
      <text class="sensor__value" data-point="B2" data-unit="°C" x="854" y="487">—</text>
    </g>

    <g class="sensor" data-sensor="B1">
      <rect class="sensor__hit" x="804" y="545" width="100" height="44" />
      <circle class="sensor__phase" cx="832.5" cy="567" r="12" />
      <circle class="sensor__cell" data-fill-point="B1" cx="832.5" cy="567" r="7.5" />
      <text class="sensor__id" x="854" y="555">B1</text>
      <text class="sensor__value" data-point="B1" data-unit="°C" x="854" y="575">—</text>
    </g>

    <circle class="storage__dot" cx="664" cy="742" r="4" />
    <text class="label" x="676" y="747">Zasobnik 200 l · parafina</text>
  </g>

  <!-- =====================================================================
       PRAWO — pomiar, obieg i źródło ciepła
       ===================================================================== -->

  <!-- Manometr obiegu ładowania. -->
  <g class="gauge" data-element="manometr-prawy">
    <path class="gauge__stem" d="M930 170 V134" />
    <image class="raster" href="/schemat/manometr.png" x="912" y="100" width="35" height="35" />
    <rect class="nakladka" x="912" y="100" width="35" height="35" rx="17" />
  </g>

  <!-- Ciepłomierz: karta Wh na obu liniach + odczyty niżej. -->
  <g class="device" data-element="meter">
    <image class="raster" href="/schemat/karta-wh.png" x="968" y="146" width="65" height="75" />
    <rect
      class="nakladka"
      x="968"
      y="146"
      width="65"
      height="75"
      rx="12"
      data-object="meter"
      data-label="Ciepłomierz"
      data-h="1.2"
    />
    <text class="label--sm" x="1000" y="134">Ciepłomierz</text>

    <g class="meter-card">
      <rect class="meter-card__body" x="880" y="264" width="170" height="104" rx="14" filter="url(#soft-sm)" />
      <text class="meta" x="892" y="286">zasilanie</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_T1" data-unit="°C" x="1038" y="286" text-anchor="end">—</text>
      <text class="meta" x="892" y="310">powrót</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_T2" data-unit="°C" x="1038" y="310" text-anchor="end">—</text>
      <text class="meta" x="892" y="334">przepływ</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_FLOW" data-unit="m³/h" x="1038" y="334" text-anchor="end">—</text>
      <text class="meta" x="892" y="358">moc</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_POWER" data-unit="kW" x="1038" y="358" text-anchor="end">—</text>
    </g>
  </g>

  <!-- Pompa obiegowa — karta na linii górnej. -->
  <g class="device" data-state="PUMP_STATE" data-element="pump">
    <image class="raster" href="/schemat/karta-pompa-obiegowa.png" x="1080" y="136" width="61" height="68" />
    <rect
      class="nakladka"
      x="1080"
      y="136"
      width="61"
      height="68"
      rx="12"
      data-object="pump"
      data-label="Pompa obiegowa"
      data-h="1.3"
    />
    <text class="label--sm" x="1110" y="124">Pompa obiegowa</text>
  </g>

  <!-- Zaworek bezpieczeństwa obiegu ładowania. -->
  <g class="valve" data-element="zawor-bezp-prawy">
    <path class="valve__arrow" d="M1240 84 V58" />
    <path class="valve__arrowhead" d="M1234 60 L1240 48 L1246 60 Z" />
    <image class="raster" href="/schemat/karta-zawor.png" x="1207" y="96" width="67" height="67" />
    <rect class="nakladka" x="1207" y="96" width="67" height="67" rx="12" />
    <text class="label--sm" x="1240" y="26">Zawór</text>
    <text class="label--sm" x="1240" y="42">bezpieczeństwa</text>
  </g>

  <!-- Zasobnik 80 l z grzałką — karta z makiety; wiersze góra/dół są żywe,
       miejsce na nie zostało w wycinku wybielone. -->
  <g class="device" data-element="buffer">
    <image class="raster" href="/schemat/karta-zasobnik.png" x="1000" y="560" width="160" height="224" />
    <rect
      class="nakladka"
      x="1000"
      y="560"
      width="160"
      height="224"
      rx="14"
      data-object="buffer"
      data-label="Zasobnik 80 l"
      data-h="4.4"
      data-vessel="true"
    />

    <g class="sensor sensor--sm" data-sensor="BUFFER_TOP">
      <circle class="sensor__cell" data-fill-point="BUFFER_TOP" cx="1026" cy="722" r="5" data-h="1.1" />
      <text class="sensor__id" x="1038" y="726">góra</text>
      <text class="sensor__value sensor__value--sm" data-point="BUFFER_TOP" data-unit="°C" x="1140" y="726" text-anchor="end">—</text>
    </g>

    <g class="sensor sensor--sm" data-sensor="BUFFER_BOTTOM">
      <circle class="sensor__cell" data-fill-point="BUFFER_BOTTOM" cx="1026" cy="750" r="5" data-h="1.1" />
      <text class="sensor__id" x="1038" y="754">dół</text>
      <text class="sensor__value sensor__value--sm" data-point="BUFFER_BOTTOM" data-unit="°C" x="1140" y="754" text-anchor="end">—</text>
    </g>
  </g>

  <!-- Naczynie przeponowe. -->
  <g class="device" data-element="naczynie-prawe">
    <image class="raster" href="/schemat/karta-naczynie.png" x="1170" y="560" width="78" height="114" />
    <rect
      class="nakladka"
      x="1170"
      y="560"
      width="78"
      height="114"
      rx="12"
      data-object="naczynie-prawe"
      data-label="Naczynie przeponowe"
      data-h="1.4"
    />
    <text class="label--sm" x="1209" y="694">Naczynie</text>
    <text class="label--sm" x="1209" y="710">przeponowe</text>
  </g>

  <!-- Pompa ciepła — karta z makiety; dioda pracy jest żywa. -->
  <g class="device" data-state="HP_STATE" data-element="heatpump">
    <image class="raster" href="/schemat/karta-pompa-ciepla.png" x="1268" y="560" width="165" height="224" />
    <rect
      class="nakladka"
      x="1268"
      y="560"
      width="165"
      height="224"
      rx="14"
      data-object="heatpump"
      data-label="Pompa ciepła"
      data-h="3"
    />
    <circle class="device__led" cx="1410" cy="582" r="5" />
  </g>

  <!-- =====================================================================
       HALA — temperatura powietrza w otoczeniu stanowiska
       ===================================================================== -->

  <g class="ambient" data-element="ambient">
    <text class="meta" x="1480" y="84" text-anchor="end">Hala · powietrze</text>
    <text class="ambient__value" data-point="AMBIENT_HALL" data-unit="°C" x="1480" y="122" text-anchor="end">—</text>
  </g>
</svg>
