<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1400 640"
  width="1400"
  height="640"
  class="schema"
  role="img"
  aria-label="Schemat instalacji magazynu ciepła PCM"
>
  <!--
    SCHEMAT INSTALACJI — PLIK ZEWNĘTRZNY.

    Rysunek jest danymi, nie kodem. Można go przerysować w dowolnym narzędziu
    graficznym i podmienić bez dotykania logiki aplikacji. Warunek jest jeden:
    zachować atrybuty data-*.

    UKŁAD: magazyn PCM stoi CENTRALNIE, a elementy instalacji odchodzą od niego
    w lewo (źródło ciepła: pompa ciepła, bufor) i w prawo (pomiar i odbiór:
    ciepłomierz, pompa obiegowa, zawór). Dzięki temu zbiornik — czyli to, co
    się bada — jest w środku uwagi, a nie w rogu.

    KONTRAKT WIĄZANIA
      data-point="A1"              element pokazuje wartość punktu (textContent)
      data-unit="°C"               jednostka dopisywana po wartości
      data-fill-point="A1"         element barwi się według wartości punktu
      data-flow="pcm-supply"       ścieżka animuje przepływ
      data-flow-source="METER_FLOW"  prędkość animacji z tej wartości
      data-state="VALVE_STATE"     element przełącza klasę is-active/is-inactive
      data-stale-hide              element chowany, gdy punkt jest przestarzały
      data-sensor="A1"             grupa sondy: kursor, podpowiedź, klik
      data-element="meter"         KLIKALNY element instalacji (nie sonda)

    KONTRAKT DLA WIDOKU 3D
    Widok trójwymiarowy nie ma własnego układu — CZYTA TEN PLIK i przelicza
    współrzędne SVG na współrzędne świata. Bryły opisują:
      data-object="storage"        bryła w scenie 3D (identyfikator)
      data-label="Magazyn PCM"     podpis bryły
      data-h="6.6"                 wysokość bryły w jednostkach świata
      data-vessel="true"           zbiornik: przezroczysty, z sondami w środku
    Prostokąt bez data-object jest w 3D pomijany — jest tylko dekoracją.

    UKŁAD SOND: dwa pręty na PRZEKĄTNYCH ZBIORNIKA (widok z góry), każdy
    z trzema sondami. W przekroju widać je obok siebie. Na każdym poziomie
    A i B to sondy na dwóch różnych przekątnych.
    Poziom 1 = dół, 2 = środek, 3 = góra (potwierdzone 2026-07-29).
  -->

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f1f14" flood-opacity="0.10" />
    </filter>

    <filter id="soft-sm" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f1f14" flood-opacity="0.10" />
    </filter>

    <!-- Delikatna siatka na obiektach — daje im fakturę modułu. -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- =====================================================================
       ŚCIEŻKI OBIEGU
       Zasilanie wchodzi do magazynu z lewej, powrót wychodzi w prawo.
       ===================================================================== -->

  <g class="pipes" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pompa ciepła -> bufor -> magazyn (wejście od lewej, u dołu). -->
    <path
      class="pipe pipe--supply"
      data-flow="pcm-supply"
      data-flow-source="METER_FLOW"
      d="M196 300 H250 M370 300 H430 V430 H540"
    />

    <!-- Magazyn -> ciepłomierz -> pompa obiegowa -> powrót do pompy ciepła. -->
    <path
      class="pipe pipe--return"
      data-flow="pcm-return"
      data-flow-source="METER_FLOW"
      d="M860 430 H960 V300 H1010 M1154 300 H1210 V560 H120 V344"
    />
  </g>

  <g class="nodes">
    <circle class="node" cx="430" cy="430" r="4.5" />
    <circle class="node" cx="960" cy="430" r="4.5" />
    <circle class="node" cx="1210" cy="560" r="4.5" />
    <circle class="node" cx="120" cy="560" r="4.5" />
  </g>

  <g class="ticks">
    <rect class="tick" x="300" y="294" width="14" height="12" rx="3" />
    <rect class="tick" x="480" y="424" width="14" height="12" rx="3" />
    <rect class="tick" x="900" y="424" width="14" height="12" rx="3" />
    <rect class="tick" x="640" y="554" width="14" height="12" rx="3" />
  </g>

  <!-- =====================================================================
       LEWA STRONA — źródło ciepła
       ===================================================================== -->

  <g class="device" data-state="HP_STATE" data-element="heatpump" filter="url(#soft)">
    <rect
      x="60"
      y="262"
      width="136"
      height="82"
      rx="18"
      class="device__body"
      data-object="heatpump"
      data-label="Pompa ciepła"
      data-h="2.4"
    />
    <rect class="device__bar" x="76" y="282" width="104" height="10" rx="5" />
    <circle class="device__led" cx="176" cy="326" r="6" />
    <text class="label" x="76" y="322">Pompa ciepła</text>
    <text class="meta" x="76" y="360">Fox Blue Line 8.1</text>
  </g>

  <g class="device" data-element="buffer" filter="url(#soft)">
    <rect
      x="250"
      y="210"
      width="120"
      height="186"
      rx="22"
      class="device__vessel"
      data-object="buffer"
      data-label="Bufor"
      data-h="4.4"
      data-vessel="true"
    />
    <text class="label" x="264" y="236">Bufor</text>

    <g class="sensor sensor--sm" data-sensor="BUFFER_TOP">
      <rect class="sensor__cell" data-fill-point="BUFFER_TOP" x="266" y="248" width="88" height="52" rx="12" data-h="1.1" />
      <text class="sensor__id" x="276" y="266">góra</text>
      <text class="sensor__value" data-point="BUFFER_TOP" data-unit="°C" x="344" y="286">—</text>
    </g>

    <g class="sensor sensor--sm" data-sensor="BUFFER_BOTTOM">
      <rect class="sensor__cell" data-fill-point="BUFFER_BOTTOM" x="266" y="312" width="88" height="52" rx="12" data-h="1.1" />
      <text class="sensor__id" x="276" y="330">dół</text>
      <text class="sensor__value" data-point="BUFFER_BOTTOM" data-unit="°C" x="344" y="350">—</text>
    </g>
  </g>

  <!-- =====================================================================
       ŚRODEK — MAGAZYN PCM
       ===================================================================== -->

  <g class="storage">
    <rect
      class="storage__body"
      x="540"
      y="90"
      width="320"
      height="420"
      rx="28"
      filter="url(#soft)"
      data-object="storage"
      data-label="Magazyn PCM"
      data-h="8"
      data-vessel="true"
      data-element="storage"
    />

    <text class="label label--strong" x="562" y="124">Magazyn PCM</text>

    <!-- Pręty pozycjonujące, do których przywiązane są sondy. -->
    <g class="rods">
      <path class="rod" d="M636 148 V478" />
      <path class="rod" d="M764 148 V478" />
      <text class="rod__label" x="636" y="500">przekątna A</text>
      <text class="rod__label" x="764" y="500">przekątna B</text>
    </g>

    <g class="levels">
      <text class="level__label" x="556" y="186">3</text>
      <text class="level__label" x="556" y="316">2</text>
      <text class="level__label" x="556" y="446">1</text>
    </g>

    <!-- Przekątna A · poziomy 3, 2, 1 -->
    <g class="sensor" data-sensor="A3">
      <rect class="sensor__cell" data-fill-point="A3" x="580" y="150" width="112" height="66" rx="15" />
      <rect class="sensor__grain" x="580" y="150" width="112" height="66" rx="15" fill="url(#grid)" />
      <text class="sensor__id" x="592" y="172">A3</text>
      <text class="sensor__value" data-point="A3" data-unit="°C" x="680" y="204">—</text>
      <circle class="sensor__phase" cx="682" cy="166" r="5" />
    </g>

    <g class="sensor" data-sensor="A2">
      <rect class="sensor__cell" data-fill-point="A2" x="580" y="280" width="112" height="66" rx="15" />
      <rect class="sensor__grain" x="580" y="280" width="112" height="66" rx="15" fill="url(#grid)" />
      <text class="sensor__id" x="592" y="302">A2</text>
      <text class="sensor__value" data-point="A2" data-unit="°C" x="680" y="334">—</text>
      <circle class="sensor__phase" cx="682" cy="296" r="5" />
    </g>

    <g class="sensor" data-sensor="A1">
      <rect class="sensor__cell" data-fill-point="A1" x="580" y="410" width="112" height="66" rx="15" />
      <rect class="sensor__grain" x="580" y="410" width="112" height="66" rx="15" fill="url(#grid)" />
      <text class="sensor__id" x="592" y="432">A1</text>
      <text class="sensor__value" data-point="A1" data-unit="°C" x="680" y="464">—</text>
      <circle class="sensor__phase" cx="682" cy="426" r="5" />
    </g>

    <!-- Przekątna B · poziomy 3, 2, 1 -->
    <g class="sensor" data-sensor="B3">
      <rect class="sensor__cell" data-fill-point="B3" x="708" y="150" width="112" height="66" rx="15" />
      <rect class="sensor__grain" x="708" y="150" width="112" height="66" rx="15" fill="url(#grid)" />
      <text class="sensor__id" x="720" y="172">B3</text>
      <text class="sensor__value" data-point="B3" data-unit="°C" x="808" y="204">—</text>
      <circle class="sensor__phase" cx="810" cy="166" r="5" />
    </g>

    <g class="sensor" data-sensor="B2">
      <rect class="sensor__cell" data-fill-point="B2" x="708" y="280" width="112" height="66" rx="15" />
      <rect class="sensor__grain" x="708" y="280" width="112" height="66" rx="15" fill="url(#grid)" />
      <text class="sensor__id" x="720" y="302">B2</text>
      <text class="sensor__value" data-point="B2" data-unit="°C" x="808" y="334">—</text>
      <circle class="sensor__phase" cx="810" cy="296" r="5" />
    </g>

    <g class="sensor" data-sensor="B1">
      <rect class="sensor__cell" data-fill-point="B1" x="708" y="410" width="112" height="66" rx="15" />
      <rect class="sensor__grain" x="708" y="410" width="112" height="66" rx="15" fill="url(#grid)" />
      <text class="sensor__id" x="720" y="432">B1</text>
      <text class="sensor__value" data-point="B1" data-unit="°C" x="808" y="464">—</text>
      <circle class="sensor__phase" cx="810" cy="426" r="5" />
    </g>
  </g>

  <!-- =====================================================================
       PRAWA STRONA — pomiar i obieg
       ===================================================================== -->

  <g class="device" data-element="meter" filter="url(#soft)">
    <rect
      x="1010"
      y="230"
      width="144"
      height="140"
      rx="20"
      class="device__body"
      data-object="meter"
      data-label="Ciepłomierz"
      data-h="2.6"
    />
    <text class="label" x="1024" y="254">Ciepłomierz</text>

    <text class="meta" x="1024" y="280">zasilanie</text>
    <text class="sensor__value sensor__value--sm" data-point="METER_T1" data-unit="°C" x="1140" y="280">—</text>

    <text class="meta" x="1024" y="304">powrót</text>
    <text class="sensor__value sensor__value--sm" data-point="METER_T2" data-unit="°C" x="1140" y="304">—</text>

    <text class="meta" x="1024" y="328">przepływ</text>
    <text class="sensor__value sensor__value--sm" data-point="METER_FLOW" data-unit="m³/h" x="1140" y="328">—</text>

    <text class="meta" x="1024" y="352">moc</text>
    <text class="sensor__value sensor__value--sm" data-point="METER_POWER" data-unit="kW" x="1140" y="352">—</text>
  </g>

  <!-- Zawór odcinający AFRISO BEV 222 — stan binarny, nigdy modulowany. -->
  <g class="valve" data-state="VALVE_STATE" data-element="valve" filter="url(#soft-sm)">
    <rect
      x="936"
      y="406"
      width="48"
      height="48"
      rx="14"
      class="device__body"
      data-object="valve"
      data-label="Zawór"
      data-h="1.3"
    />
    <path class="valve__glyph" d="M952 430 h16 M960 422 v16" />
    <text class="label label--sm" x="960" y="474">Zawór</text>
  </g>

  <g class="valve" data-state="PUMP_STATE" data-element="pump" filter="url(#soft-sm)">
    <rect
      x="640"
      y="536"
      width="48"
      height="48"
      rx="14"
      class="device__body"
      data-object="pump"
      data-label="Pompa obiegowa"
      data-h="1.3"
    />
    <circle class="valve__glyph-dot" cx="664" cy="560" r="8" />
    <text class="label label--sm" x="664" y="604">Pompa obiegowa</text>
  </g>

  <!-- =====================================================================
       HALA — temperatura powietrza w otoczeniu stanowiska
       ===================================================================== -->

  <g class="ambient" data-element="ambient">
    <text class="meta" x="1210" y="130">Hala · powietrze</text>
    <text class="ambient__value" data-point="AMBIENT_HALL" data-unit="°C" x="1210" y="168">—</text>
  </g>
</svg>
