<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-16 -16 1472 716"
  width="1472"
  height="716"
  preserveAspectRatio="xMidYMid meet"
  class="schema"
  role="img"
  aria-label="Schemat instalacji magazynu ciepła PCM"
>
  <!--
    SCHEMAT INSTALACJI — PLIK ZEWNĘTRZNY.

    Rysunek jest danymi, nie kodem. Można go przerysować w dowolnym narzędziu
    graficznym i podmienić bez dotykania logiki aplikacji. Warunek jest jeden:
    zachować atrybuty data-*.

    UKŁAD ODWZOROWUJE RYSUNEK TECHNICZNY STANOWISKA (wersja z 2026-07-31):

      LEWO — odbiór ciepła na wodę użytkową:
        woda wodociągowa → filtr odkamieniający → podgrzewacz wody,
        na obiegu zaworek bezpieczeństwa, manometr, naczynie przeponowe
        i ciepłomierz obiegu odbioru

      ŚRODEK — magazyn PCM / zasobnik 200 l z sondami temperatury

      PRAWO — źródło ciepła:
        pompa ciepła → zasobnik 80 l z grzałką → pompa obiegowa → ciepłomierz,
        z zaworkiem bezpieczeństwa, manometrem i naczyniem przeponowym

    CZERWONY to zasilanie (ciepło idzie DO odbiornika), NIEBIESKI powrót.
    Magazyn stoi centralnie, bo to on jest przedmiotem badania.

    ODSTĘPSTWO OD RYSUNKU, ŚWIADOME: rysunek pokazuje w zasobniku PCM
    dziewięć króćców pomiarowych, a instalacja ma podłączonych SZEŚĆ sond
    (dwie przekątne × trzy poziomy). Rysujemy sześć, bo tyle mamy danych —
    trzy puste kółka wyglądałyby na zepsute czujniki.

    VIEWBOX ma 16 jednostek zapasu z każdej strony. Zapas nie jest ozdobą:
    podpisy pokazują ZMIENNE wartości, a dłuższy tekst rósłby w stronę
    krawędzi, którą SVG obcina.

    KONTRAKT WIĄZANIA
      data-point="A1"              element pokazuje wartość punktu (textContent)
      data-unit="°C"               jednostka dopisywana po wartości
      data-fill-point="A1"         element barwi się według wartości punktu
      data-flow="pcm-supply"       ścieżka animuje przepływ
      data-flow-source="METER_FLOW"  prędkość animacji z tej wartości
      data-state="VALVE_STATE"     element przełącza klasę is-active/is-inactive
      data-stale-hide              element chowany, gdy punkt jest przestarzały
      data-sensor="A1"             grupa sondy: kursor, podpowiedź, klik
      data-element="meter"         KLIKALNY element instalacji (nie sonda)

    KONTRAKT DLA WIDOKU 3D
    Widok trójwymiarowy nie ma własnego układu — CZYTA TEN PLIK i przelicza
    współrzędne SVG na współrzędne świata. Bryły opisują:
      data-object="storage"        bryła w scenie 3D (identyfikator)
      data-label="Magazyn PCM"     podpis bryły
      data-h="6.6"                 wysokość bryły w jednostkach świata
      data-vessel="true"           zbiornik: przezroczysty, z sondami w środku
    Prostokąt bez data-object jest w 3D pomijany — jest tylko dekoracją.

    UKŁAD SOND: dwa pręty na PRZEKĄTNYCH ZBIORNIKA (widok z góry), każdy
    z trzema sondami. W przekroju widać je obok siebie. Na każdym poziomie
    A i B to sondy na dwóch różnych przekątnych.
    Poziom 1 = dół, 2 = środek, 3 = góra (potwierdzone 2026-07-29).
  -->

  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f1f14" flood-opacity="0.10" />
    </filter>

    <filter id="soft-sm" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f1f14" flood-opacity="0.10" />
    </filter>

    <!-- Delikatna siatka na obiektach — daje im fakturę modułu. -->
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0v12" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- =====================================================================
       OBIEGI
       Górna nitka (czerwona) to zasilanie, dolna (niebieska) powrót.
       Oba obiegi animują się z JEDNEGO pomiaru przepływu — ciepłomierz
       obiegu odbioru nie jest jeszcze wpięty do Miniservera, więc nie ma
       drugiej liczby. Gdy się pojawi, wystarczy zmienić data-flow-source
       na lewej ścieżce.
       ===================================================================== -->

  <g class="pipes" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Magazyn -> podgrzewacz wody wodociągowej (zasilanie odbioru). -->
    <path
      class="pipe pipe--supply"
      data-flow="dhw-supply"
      data-flow-source="METER_FLOW"
      d="M590 150 H230 V450"
    />

    <!-- Podgrzewacz -> magazyn (powrót odbioru). -->
    <path
      class="pipe pipe--return"
      data-flow="dhw-return"
      data-flow-source="METER_FLOW"
      d="M272 486 H320 V200 H590"
    />

    <!-- Pompa ciepła / zasobnik 80 l -> magazyn (zasilanie ładowania). -->
    <path
      class="pipe pipe--supply"
      data-flow="pcm-supply"
      data-flow-source="METER_FLOW"
      d="M1385 250 V150 H850"
    />

    <!-- Magazyn -> pompa obiegowa -> ciepłomierz -> źródło (powrót ładowania). -->
    <path
      class="pipe pipe--return"
      data-flow="pcm-return"
      data-flow-source="METER_FLOW"
      d="M850 200 H1420 M1190 200 V250 M1355 200 V250"
    />
  </g>

  <!-- Woda wodociągowa — wlot zimnej wody, poza obiegiem grzewczym. -->
  <path class="pipe pipe--water" d="M44 530 H188" fill="none" />

  <g class="nodes">
    <circle class="node" cx="230" cy="150" r="4.5" />
    <circle class="node" cx="320" cy="200" r="4.5" />
    <circle class="node" cx="1190" cy="200" r="4.5" />
    <circle class="node" cx="1355" cy="200" r="4.5" />
    <circle class="node" cx="1385" cy="150" r="4.5" />
  </g>

  <!-- Strzałki kierunku — czytelne także wtedy, gdy nic nie płynie. -->
  <g class="arrows">
    <path class="arrow" d="M470 144 l-12 6 12 6 z" />
    <path class="arrow" d="M430 194 l12 6 -12 6 z" />
    <path class="arrow" d="M1050 194 l12 6 -12 6 z" />
    <path class="arrow" d="M1150 144 l-12 6 12 6 z" />
  </g>

  <!-- =====================================================================
       LEWO — odbiór ciepła na wodę użytkową
       ===================================================================== -->

  <g class="water-inlet" data-element="woda">
    <text class="label" x="30" y="500">Woda</text>
    <text class="label" x="30" y="520">wodociągowa</text>
  </g>

  <!-- Filtr odkamieniający — soczewka na przewodzie wody zimnej. -->
  <g class="device" data-element="filtr" filter="url(#soft-sm)">
    <ellipse
      cx="146"
      cy="530"
      rx="30"
      ry="13"
      class="device__body"
      data-object="filtr"
      data-label="Filtr odkamieniający"
      data-h="0.8"
    />
    <text class="label label--sm" x="146" y="566">Filtr odkamieniający</text>
  </g>

  <g class="device" data-element="podgrzewacz" filter="url(#soft)">
    <rect
      x="188"
      y="450"
      width="84"
      height="170"
      rx="22"
      class="device__vessel"
      data-object="podgrzewacz"
      data-label="Podgrzewacz wody"
      data-h="3.4"
      data-vessel="true"
    />
    <text class="label label--sm" x="230" y="646">Podgrzewacz</text>
    <text class="label label--sm" x="230" y="664">wody wodociągowej</text>
  </g>

  <!-- Zaworek bezpieczeństwa obiegu odbioru. -->
  <g class="valve valve--safety" data-element="zawor-bezp-lewy">
    <path class="valve__safety-glyph" d="M222 138 l16 -10 v20 z M230 150 v-12" />
    <text class="label label--sm" x="196" y="118">Zaworek bezp.</text>
  </g>

  <!-- Manometr obiegu odbioru. -->
  <g class="gauge" data-element="manometr-lewy">
    <path class="gauge__stem" d="M300 150 V124" />
    <circle class="gauge__face" cx="300" cy="112" r="12" />
    <text class="gauge__text" x="300" y="117">P</text>
  </g>

  <!-- Naczynie przeponowe obiegu odbioru. -->
  <g class="device" data-element="naczynie-lewe" filter="url(#soft-sm)">
    <path class="gauge__stem" d="M370 150 V236" />
    <rect
      x="348"
      y="236"
      width="44"
      height="62"
      rx="16"
      class="device__body"
      data-object="naczynie-lewe"
      data-label="Naczynie przeponowe"
      data-h="1.4"
    />
    <path class="vessel__band" d="M352 262 H388 M352 272 H388" />
    <text class="label label--sm" x="370" y="320">Naczynie</text>
  </g>

  <!-- Ciepłomierz obiegu odbioru — w instalacji jest, do Miniservera
       jeszcze nie wpięty, więc nie pokazuje wartości. -->
  <g class="meter-box" data-element="cieplomierz-odbior">
    <rect x="418" y="188" width="36" height="24" rx="5" class="meter-box__body" />
    <text class="meter-box__text" x="436" y="205">Wm</text>
    <text class="label label--sm" x="436" y="238">ciepłomierz odbioru</text>
  </g>

  <!-- =====================================================================
       ŚRODEK — MAGAZYN PCM / ZASOBNIK 200 l
       ===================================================================== -->

  <g class="storage">
    <rect
      class="storage__body"
      x="590"
      y="250"
      width="260"
      height="330"
      rx="26"
      filter="url(#soft)"
      data-object="storage"
      data-label="Magazyn PCM"
      data-h="8"
      data-vessel="true"
      data-element="storage"
    />

    <text class="label label--strong" x="610" y="284">PCM / Zasobnik 200 l</text>

    <!-- Pręty pozycjonujące, do których przywiązane są sondy. -->
    <g class="rods">
      <path class="rod" d="M668 302 V556" />
      <path class="rod" d="M772 302 V556" />
      <text class="rod__label" x="668" y="574">przekątna A</text>
      <text class="rod__label" x="772" y="574">przekątna B</text>
    </g>

    <g class="levels">
      <text class="level__label" x="604" y="338">3</text>
      <text class="level__label" x="604" y="430">2</text>
      <text class="level__label" x="604" y="522">1</text>
    </g>

    <!-- Przekątna A · poziomy 3, 2, 1 -->
    <g class="sensor" data-sensor="A3">
      <rect class="sensor__cell" data-fill-point="A3" x="622" y="304" width="92" height="58" rx="14" />
      <rect class="sensor__grain" x="622" y="304" width="92" height="58" rx="14" fill="url(#grid)" />
      <text class="sensor__id" x="632" y="324">A3</text>
      <text class="sensor__value" data-point="A3" data-unit="°C" x="704" y="352">—</text>
      <circle class="sensor__phase" cx="704" cy="318" r="5" />
    </g>

    <g class="sensor" data-sensor="A2">
      <rect class="sensor__cell" data-fill-point="A2" x="622" y="396" width="92" height="58" rx="14" />
      <rect class="sensor__grain" x="622" y="396" width="92" height="58" rx="14" fill="url(#grid)" />
      <text class="sensor__id" x="632" y="416">A2</text>
      <text class="sensor__value" data-point="A2" data-unit="°C" x="704" y="444">—</text>
      <circle class="sensor__phase" cx="704" cy="410" r="5" />
    </g>

    <g class="sensor" data-sensor="A1">
      <rect class="sensor__cell" data-fill-point="A1" x="622" y="488" width="92" height="58" rx="14" />
      <rect class="sensor__grain" x="622" y="488" width="92" height="58" rx="14" fill="url(#grid)" />
      <text class="sensor__id" x="632" y="508">A1</text>
      <text class="sensor__value" data-point="A1" data-unit="°C" x="704" y="536">—</text>
      <circle class="sensor__phase" cx="704" cy="502" r="5" />
    </g>

    <!-- Przekątna B · poziomy 3, 2, 1 -->
    <g class="sensor" data-sensor="B3">
      <rect class="sensor__cell" data-fill-point="B3" x="726" y="304" width="92" height="58" rx="14" />
      <rect class="sensor__grain" x="726" y="304" width="92" height="58" rx="14" fill="url(#grid)" />
      <text class="sensor__id" x="736" y="324">B3</text>
      <text class="sensor__value" data-point="B3" data-unit="°C" x="808" y="352">—</text>
      <circle class="sensor__phase" cx="808" cy="318" r="5" />
    </g>

    <g class="sensor" data-sensor="B2">
      <rect class="sensor__cell" data-fill-point="B2" x="726" y="396" width="92" height="58" rx="14" />
      <rect class="sensor__grain" x="726" y="396" width="92" height="58" rx="14" fill="url(#grid)" />
      <text class="sensor__id" x="736" y="416">B2</text>
      <text class="sensor__value" data-point="B2" data-unit="°C" x="808" y="444">—</text>
      <circle class="sensor__phase" cx="808" cy="410" r="5" />
    </g>

    <g class="sensor" data-sensor="B1">
      <rect class="sensor__cell" data-fill-point="B1" x="726" y="488" width="92" height="58" rx="14" />
      <rect class="sensor__grain" x="726" y="488" width="92" height="58" rx="14" fill="url(#grid)" />
      <text class="sensor__id" x="736" y="508">B1</text>
      <text class="sensor__value" data-point="B1" data-unit="°C" x="808" y="536">—</text>
      <circle class="sensor__phase" cx="808" cy="502" r="5" />
    </g>

    <text class="label label--sm storage__note" x="720" y="606">
      pomiar temperatury zasobnika / PCM
    </text>
  </g>

  <!-- =====================================================================
       PRAWO — źródło ciepła, pomiar i obieg
       ===================================================================== -->

  <!-- Manometr obiegu ładowania. -->
  <g class="gauge" data-element="manometr-prawy">
    <path class="gauge__stem" d="M880 150 V124" />
    <circle class="gauge__face" cx="880" cy="112" r="12" />
    <text class="gauge__text" x="880" y="117">P</text>
  </g>

  <!-- Ciepłomierz AXIOMA — ten podaje prawdziwe liczby. -->
  <g class="meter-box" data-element="meter">
    <rect
      x="908"
      y="188"
      width="36"
      height="24"
      rx="5"
      class="meter-box__body"
      data-object="meter"
      data-label="Ciepłomierz"
      data-h="1.2"
    />
    <text class="meter-box__text" x="926" y="205">Wm</text>

    <g class="meter-card" filter="url(#soft-sm)">
      <rect class="meter-card__body" x="880" y="246" width="196" height="118" rx="16" />
      <text class="label label--sm meter-card__title" x="894" y="268">Ciepłomierz</text>

      <text class="meta" x="894" y="292">zasilanie</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_T1" data-unit="°C" x="1062" y="292">—</text>

      <text class="meta" x="894" y="312">powrót</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_T2" data-unit="°C" x="1062" y="312">—</text>

      <text class="meta" x="894" y="332">przepływ</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_FLOW" data-unit="m³/h" x="1062" y="332">—</text>

      <text class="meta" x="894" y="352">moc</text>
      <text class="sensor__value sensor__value--sm" data-point="METER_POWER" data-unit="kW" x="1062" y="352">—</text>
    </g>
  </g>

  <!-- Pompa obiegowa — na powrocie, zgodnie z rysunkiem. -->
  <g class="valve" data-state="PUMP_STATE" data-element="pump" filter="url(#soft-sm)">
    <circle
      cx="1000"
      cy="200"
      r="17"
      class="device__body"
      data-object="pump"
      data-label="Pompa obiegowa"
      data-h="1.3"
    />
    <path class="valve__pump-glyph" d="M993 191 l14 9 -14 9 z" />
    <text class="label label--sm" x="1000" y="240">Pompa obiegowa</text>
  </g>

  <!-- Zaworek bezpieczeństwa obiegu ładowania. -->
  <g class="valve valve--safety" data-element="zawor-bezp-prawy">
    <path class="valve__safety-glyph" d="M1092 138 l16 -10 v20 z M1100 150 v-12" />
    <text class="label label--sm" x="1100" y="118">Zaworek bezp.</text>
  </g>

  <!-- Zasobnik 80 l z grzałką. Identyfikator „buffer" zostaje bez zmian —
       historia pomiarów i panel elementu są do niego przywiązane. -->
  <g class="device" data-element="buffer" filter="url(#soft)">
    <rect
      x="1130"
      y="250"
      width="120"
      height="300"
      rx="22"
      class="device__vessel"
      data-object="buffer"
      data-label="Zasobnik 80 l"
      data-h="4.4"
      data-vessel="true"
    />
    <text class="label label--sm" x="1190" y="576">Zasobnik 80 l</text>
    <text class="label label--sm" x="1190" y="594">z grzałką</text>

    <g class="sensor sensor--sm" data-sensor="BUFFER_TOP">
      <rect class="sensor__cell" data-fill-point="BUFFER_TOP" x="1146" y="286" width="88" height="52" rx="12" data-h="1.1" />
      <text class="sensor__id" x="1156" y="304">góra</text>
      <text class="sensor__value" data-point="BUFFER_TOP" data-unit="°C" x="1224" y="324">—</text>
    </g>

    <g class="sensor sensor--sm" data-sensor="BUFFER_BOTTOM">
      <rect class="sensor__cell" data-fill-point="BUFFER_BOTTOM" x="1146" y="452" width="88" height="52" rx="12" data-h="1.1" />
      <text class="sensor__id" x="1156" y="470">dół</text>
      <text class="sensor__value" data-point="BUFFER_BOTTOM" data-unit="°C" x="1224" y="490">—</text>
    </g>
  </g>

  <!-- Naczynie przeponowe obiegu ładowania — między zasobnikiem a pompą. -->
  <g class="device" data-element="naczynie-prawe" filter="url(#soft-sm)">
    <path class="gauge__stem" d="M1290 200 V318" />
    <rect
      x="1268"
      y="318"
      width="44"
      height="62"
      rx="16"
      class="device__body"
      data-object="naczynie-prawe"
      data-label="Naczynie przeponowe"
      data-h="1.4"
    />
    <path class="vessel__band" d="M1272 344 H1308 M1272 354 H1308" />
    <text class="label label--sm" x="1290" y="402">Naczynie</text>
  </g>

  <g class="device" data-state="HP_STATE" data-element="heatpump" filter="url(#soft)">
    <rect
      x="1330"
      y="250"
      width="110"
      height="300"
      rx="20"
      class="device__body"
      data-object="heatpump"
      data-label="Pompa ciepła"
      data-h="3"
    />
    <rect class="device__bar" x="1346" y="276" width="78" height="10" rx="5" />
    <circle class="device__led" cx="1424" cy="534" r="6" />
    <text class="label label--sm" x="1385" y="576">Pompa ciepła</text>
    <text class="meta meta--center" x="1385" y="594">Fox Blue Line 8.1</text>
  </g>

  <!-- =====================================================================
       HALA — temperatura powietrza w otoczeniu stanowiska
       ===================================================================== -->

  <g class="ambient" data-element="ambient">
    <text class="meta" x="1130" y="86">Hala · powietrze</text>
    <text class="ambient__value" data-point="AMBIENT_HALL" data-unit="°C" x="1130" y="124">—</text>
  </g>
</svg>
